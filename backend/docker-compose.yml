# Local MQTT broker for the greenhouse demo (Member 2).
# MQTT is published to localhost only; anonymous access is for local demo use.
# switches to mqtts:// + MQTT_USERNAME/MQTT_PASSWORD when TLS is needed.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: greenhouse-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # localhost only, demo MQTT
      # - "8883:8883" # uncomment together with the TLS listener below
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
