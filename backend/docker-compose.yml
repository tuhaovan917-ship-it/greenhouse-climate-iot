# Local MQTT broker for the greenhouse demo (Member 2).
# Anonymous access on 1883 is fine for a classroom LAN demo; the contract
# switches to mqtts:// + MQTT_USERNAME/MQTT_PASSWORD when TLS is needed.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: greenhouse-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # plain MQTT, demo
      # - "8883:8883" # uncomment together with the TLS listener below
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
