# Mosquitto config for the greenhouse demo (Member 2).
# Anonymous listener on 1883 so a fresh clone works with zero setup.
# For TLS, set up certificates in ./certs and enable the listener at the bottom.

persistence true
log_dest stdout
connection_messages true

listener 1883
protocol mqtt
allow_anonymous true

# --- TLS (mqtts://:8883) -------------------------------------------------
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
# allow_anonymous false
